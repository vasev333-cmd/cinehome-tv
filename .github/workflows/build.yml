name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android TV APK
        run: |
          cd android-tv-wrapper
          gradle assembleDebug

      - name: Upload CineHome TV APK
        uses: actions/upload-artifact@v4
        with:
          name: CineHome-TCL-TV
          path: android-tv-wrapper/app/build/outputs/apk/debug/*.apk
