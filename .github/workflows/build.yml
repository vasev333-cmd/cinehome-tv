name: Build CineHome Android TV App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Prepare Clean Android Project
        run: |
          rm -rf build-app
          mkdir -p build-app/app/src/main/java/com/cinehome/tv
          mkdir -p build-app/app/src/main/assets
          mkdir -p build-app/app/src/main/res/drawable

          # Вграждане на вашия интерфейс вътре в приложението
          cp index.html build-app/app/src/main/assets/index.html

          # Приемане на Android лицензи и път до SDK
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > build-app/local.properties
          echo "android.useAndroidX=true" > build-app/gradle.properties

          # settings.gradle
          cat << 'EOF' > build-app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'CineHomeTV'
          include ':app'
          EOF

          # root build.gradle
          cat << 'EOF' > build-app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # app/build.gradle
          cat << 'EOF' > build-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.cinehome.tv'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.cinehome.tv'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          # AndroidManifest.xml (специално за начален екран на Android TV)
          cat << 'EOF' > build-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.cinehome.tv">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />

              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />

              <application
                  android:label="CineHome TV"
                  android:banner="@drawable/tv_banner"
                  android:icon="@drawable/tv_banner"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # tv_banner.xml (икона за началния екран на TCL)
          cat << 'EOF' > build-app/app/src/main/res/drawable/tv_banner.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:angle="45"
                  android:startColor="#1e1b4b"
                  android:endColor="#8b5cf6" />
              <corners android:radius="16dp" />
          </shape>
          EOF

          # MainActivity.java (директно управление с дистанционното)
          cat << 'EOF' > build-app/app/src/main/java/com/cinehome/tv/MainActivity.java
          package com.cinehome.tv;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  if (event.getAction() == KeyEvent.ACTION_DOWN) {
                      int code = event.getKeyCode();
                      if (code == KeyEvent.KEYCODE_DPAD_UP || code == KeyEvent.KEYCODE_DPAD_DOWN ||
                          code == KeyEvent.KEYCODE_DPAD_LEFT || code == KeyEvent.KEYCODE_DPAD_RIGHT ||
                          code == KeyEvent.KEYCODE_DPAD_CENTER || code == KeyEvent.KEYCODE_ENTER) {
                          return webView.dispatchKeyEvent(event);
                      } else if (code == KeyEvent.KEYCODE_BACK) {
                          webView.evaluateJavascript("window.dispatchEvent(new KeyboardEvent('keydown', {'key': 'Escape'}));", null);
                          return true;
                      }
                  }
                  return super.dispatchKeyEvent(event);
              }
          }
          EOF

      - name: Compile CineHome TV APK
        run: |
          cd build-app
          gradle assembleDebug --stacktrace

      - name: Upload CineHome TV APK
        uses: actions/upload-artifact@v4
        with:
          name: CineHome-TCL-TV
          path: build-app/app/build/outputs/apk/debug/*.apk
